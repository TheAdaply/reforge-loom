[project]
name = "loom"
version = "0.1.0"
description = "loom — spec-driven coordination gate for multi-agent repos"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
]

[project.scripts]
loom = "loom.cli.main:main"
loom-gate = "loom.hook.gate:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
